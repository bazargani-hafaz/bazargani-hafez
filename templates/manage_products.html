{% extends 'base.html' %}{% block content %}<div class="wrap section"><h1>مدیریت محصولات</h1><form method="post" enctype="multipart/form-data" class="form"><input name="name" required placeholder="نام محصول"><select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="brand" placeholder="برند"><input type="file" name="image" accept="image/*"><textarea name="description" placeholder="توضیحات"></textarea><textarea name="specs" placeholder="مشخصات"></textarea><label><input type="checkbox" name="featured"> منتخب</label><button class="btn">افزودن</button></form><div class="list">{% for p in products %}<div><b>{{p.name}}</b><span>{{p.category}}</span><form method="post" action="/admin/products/delete/{{p.id}}"><button class="danger">حذف</button></form></div>{% endfor %}</div></div>{% endblock %}
