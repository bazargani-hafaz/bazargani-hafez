{% extends 'base.html' %}{% block content %}<div class="wrap section"><h1>محصولات</h1><form class="filters"><input name="q" value="{{q}}" placeholder="جستجوی محصول..."><select name="cat"><option value="">همه دسته‌ها</option>{% for c in nav_categories %}<option value="{{c.slug}}">{{c.name}}</option>{% endfor %}</select><button class="btn">جستجو</button></form><div class="grid">{% for p in products %}<a class="card" href="/product/{{p.slug}}"><div class="pic">{% if p.image %}<img src="/static/uploads/{{p.image}}">{% else %}PRODUCT{% endif %}</div><h3>{{p.name}}</h3><small>{{p.brand}} | {{p.category}}</small></a>{% else %}<p>محصولی پیدا نشد.</p>{% endfor %}</div></div>{% endblock %}
