{% extends 'base.html' %}{% block title %}علاقه‌مندی‌ها | {{settings.site_name}}{% endblock %}{% block content %}<main class="wrap section wishlist-page"><header><span class="eyebrow">MY COLLECTION</span><h1>علاقه‌مندی‌های من</h1><p>محصولاتی که ذخیره کرده‌ای اینجا می‌مانند.</p></header><div id="wishlistGrid" class="wishlist-grid"></div><div id="wishlistEmpty" class="wishlist-empty">هنوز محصولی ذخیره نکرده‌ای.</div></main><script>(()=>{const grid=document.getElementById('wishlistGrid'),empty=document.getElementById('wishlistEmpty');let list=[];try{list=JSON.parse(localStorage.getItem('hafez_wishlist')||'[]')}catch{};if(list.length){empty.style.display='none';grid.innerHTML=list.map(p=>`<a class="wishlist-card" href="${p.url}"><span>♥</span><b>${p.name}</b><small>مشاهده محصول ←</small></a>`).join('')}</script><style>.wishlist-page{padding:60px 0 100px}.wishlist-page h1{font-size:42px;margin:7px 0}.wishlist-page p{color:#858b95}.wishlist-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:28px}.wishlist-card{display:flex;flex-direction:column;gap:10px;min-height:130px;padding:20px;border:1px solid #e1ddd5;border-radius:18px;background:#fff;color:#222;text-decoration:none}.wishlist-card span{color:#a77c35;font-size:22px}.wishlist-card b{font-size:14px}.wishlist-card small{margin-top:auto;color:#92733a}.wishlist-empty{margin-top:30px;padding:50px;border:1px dashed #d7d0c4;border-radius:20px;text-align:center;color:#888}@media(max-width:800px){.wishlist-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wishlist-grid{grid-template-columns:1fr}.wishlist-page h1{font-size:30px}}.hafez-dark .wishlist-card{background:#11161d;color:#eee;border-color:#303743}</style>{% endblock %}
